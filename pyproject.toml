[project]
name = "nexus-r"
version = "0.5.0"
description = "Evidence-Driven Linux Security Research and Privilege-Escalation Analysis Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rendy" }]
dependencies = [
    "pydantic>=2.9.0",
    "typer>=0.12.0",
]

[project.scripts]
nexus-r = "nexus_r.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_r"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
